<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimeTubePro — Web Studio | Central Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Great+Vibes&family=Caveat:wght@500;600&family=Dancing+Script:wght@500;600&family=Kaushan+Script&family=Pacifico&family=Cedarville+Cursive&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
:root{
  --text:#eef2ff; --muted:#9aa3c7; --border:rgba(255,255,255,.09);
  --cyan:#00d9ff; --purple:#a855f7; --pink:#ff2fd2; --green:#22e58b; --gold:#ffc83d;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Poppins',system-ui,sans-serif;color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;
  background:#040119;
}

/* ════ ANIMATED GRADIENT TEXT ════ */
.agrad{
  background:linear-gradient(90deg,#00d9ff,#3b82f6,#a855f7,#ff2fd2,#00d9ff);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:agrad 6s linear infinite;
}
@keyframes agrad{0%{background-position:0% 50%}100%{background-position:300% 50%}}

.f-vibes{font-family:'Great Vibes',cursive}
.f-dancing{font-family:'Dancing Script',cursive}
.f-caveat{font-family:'Caveat',cursive}
.f-alex{font-family:'Alex Brush',cursive}
.f-kaushan{font-family:'Kaushan Script',cursive}
.f-pacifico{font-family:'Pacifico',cursive}
.f-cedarville{font-family:'Cedarville Cursive',cursive}
.grad-blue{background:linear-gradient(90deg,#3b82f6,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad-cyan{background:linear-gradient(90deg,#00d9ff,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad-green{background:linear-gradient(90deg,#22e58b,#0ea5e9);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ════ LOADING SCREEN ════ */
#loader{position:fixed;inset:0;z-index:999;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:radial-gradient(ellipse at center,#0d0640 0%,#040119 75%);
  transition:opacity .6s ease}
#loader.hide{opacity:0;pointer-events:none}
.loader-logo{width:86px;height:86px;display:grid;place-items:center;margin-bottom:4px}
.loader-logo img{width:100%;height:100%;object-fit:contain}
.loader-logo svg{width:86px;height:86px;filter:drop-shadow(0 0 20px rgba(0,217,255,.65));
  animation:loaderPulse 1.5s ease-in-out infinite}
@keyframes loaderPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.loader-title{font-size:clamp(2rem,5vw,2.9rem);font-weight:800}
.loader-sub{font-size:clamp(1.8rem,4vw,2.4rem);margin-top:-10px}
.loader-bar{width:min(320px,70vw);height:6px;margin-top:10px;border-radius:6px;
  background:rgba(255,255,255,.08);border:1px solid rgba(0,217,255,.3);overflow:hidden}
.loader-bar span{display:block;height:100%;width:0;border-radius:6px;
  background:linear-gradient(90deg,#00d9ff,#a855f7,#ff2fd2);
  box-shadow:0 0 14px rgba(0,217,255,.8)}
.loader-pct{font-size:.8rem;color:var(--muted);letter-spacing:.2em}

/* ════ BACKGROUND — full cover, ek piece ════ */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;
  background:linear-gradient(180deg,#040119 0%,#0a0433 40%,#150a45 65%,#241059 85%,#311263 100%)}
.bg-glow{position:absolute;border-radius:50%;filter:blur(90px)}
.glow-left {width:55vw;height:55vw;left:-18vw;top:-8vw; background:radial-gradient(circle,rgba(37,99,235,.45),transparent 65%)}
.glow-right{width:55vw;height:55vw;right:-18vw;top:-6vw;background:radial-gradient(circle,rgba(168,85,247,.38),transparent 65%)}
.glow-horizon{width:120vw;height:34vw;left:-10vw;bottom:-16vw;filter:blur(70px);
  background:radial-gradient(ellipse at center,rgba(0,217,255,.30),rgba(236,72,153,.18) 45%,transparent 70%)}
.bg-mountains{position:absolute;left:0;right:0;bottom:0;width:100%;height:36vh;min-height:190px}
.bg-img{position:absolute;inset:0;display:none;
  background-repeat:no-repeat;background-position:center;background-size:cover}
.bg-img.on{display:block}
.bg.custom .bg-glow,.bg.custom .bg-mountains{display:none}
.bg::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(2,0,15,.55) 100%)}
.bg.custom::after{background:radial-gradient(ellipse at center,transparent 60%,rgba(2,0,15,.30) 100%)}

/* ════ PARTICLES ════ */
.fx-layer{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
.star.cyan{background:#7de8ff;box-shadow:0 0 6px #00d9ff}
.star.purple{background:#d8b4fe;box-shadow:0 0 6px #a855f7}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
.p-fire{position:absolute;bottom:-12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  opacity:0;filter:blur(.4px);animation:fireRise var(--dur) linear infinite;animation-delay:var(--delay)}
@keyframes fireRise{0%{transform:translate(0,0) scale(.6);opacity:0}12%{opacity:.95}
  55%{transform:translate(var(--sway),-38vh) scale(1.25);opacity:.7}
  100%{transform:translate(calc(var(--sway)*-.6),-72vh) scale(.35);opacity:0}}
.p-bubble{position:absolute;bottom:-20px;border-radius:50%;opacity:0;
  border:1px solid rgba(125,232,255,.55);
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),rgba(0,217,255,.10) 60%,rgba(0,217,255,.04));
  box-shadow:inset 0 0 6px rgba(125,232,255,.35);
  animation:bubbleRise var(--dur) linear infinite;animation-delay:var(--delay)}
@keyframes bubbleRise{0%{transform:translate(0,0) scale(.7);opacity:0}10%{opacity:.85}
  50%{transform:translate(var(--sway),-45vh) scale(1)}
  100%{transform:translate(calc(var(--sway)*-1),-88vh) scale(1.05);opacity:0}}
.p-petal{position:absolute;top:-16px;width:9px;height:7px;opacity:0;border-radius:60% 40% 60% 40%;
  background:linear-gradient(135deg,#ff9ad5,#ec4899);box-shadow:0 0 6px rgba(236,72,153,.5);
  animation:petalFall var(--dur) linear infinite;animation-delay:var(--delay)}
@keyframes petalFall{0%{transform:translate(0,0) rotate(0deg);opacity:0}10%{opacity:.9}
  100%{transform:translate(var(--sway),105vh) rotate(340deg);opacity:.1}}
body.calm .fx-layer,body.calm .bg-glow{display:none}

/* ════ TOPBAR ════ */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;
  padding:12px clamp(14px,3vw,40px);
  border-bottom:1px solid rgba(0,217,255,.18);
  background:rgba(4,2,18,.6);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand-logo{width:44px;height:44px;flex-shrink:0;display:grid;place-items:center}
.brand-logo img{width:100%;height:100%;object-fit:contain}
.brand-logo svg{width:44px;height:44px}
.brand-name{font-size:1.25rem;font-weight:800;line-height:1.1}
.brand-sub{font-size:.58rem;letter-spacing:.42em;color:var(--muted);text-transform:uppercase;font-weight:600}

.nav{display:flex;gap:6px}
.nav a{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;
  text-decoration:none;color:var(--muted);font-size:.92rem;font-weight:500;position:relative;transition:color .2s}
.nav a svg{width:17px;height:17px}
.nav a:hover{color:var(--text)}
.nav a.active{color:#7fe3ff}
.nav a.active::after{content:"";position:absolute;left:16px;right:16px;bottom:-13px;height:3px;
  border-radius:3px;background:linear-gradient(90deg,#00d9ff,#a855f7);
  box-shadow:0 0 12px rgba(0,217,255,.8)}

.searchbox{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;
  background:rgba(255,255,255,.05);border:1px solid var(--border);min-width:230px}
.searchbox input{background:none;border:none;outline:none;color:var(--text);
  font-family:inherit;font-size:.82rem;width:100%}
.searchbox input::placeholder{color:var(--muted)}
.searchbox svg{width:16px;height:16px;color:var(--muted);flex-shrink:0}

.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
  border:1px solid var(--border);background:rgba(255,255,255,.05);color:#cdd6ff;cursor:pointer;transition:.2s}
.icon-btn:hover{border-color:rgba(0,217,255,.5);color:#7fe3ff;box-shadow:0 0 14px rgba(0,217,255,.25)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.playing{color:#7fe3ff;border-color:rgba(0,217,255,.6);
  box-shadow:0 0 14px rgba(0,217,255,.4)}

/* ════ MUSIC PANEL ════ */
.music-wrap{position:relative}
.music-panel{position:absolute;right:0;top:calc(100% + 12px);width:262px;
  background:rgba(10,6,34,.96);backdrop-filter:blur(14px);
  border:1px solid rgba(0,217,255,.35);border-radius:16px;
  padding:14px;display:none;flex-direction:column;gap:10px;
  box-shadow:0 14px 44px rgba(0,0,0,.5),0 0 24px rgba(0,217,255,.15);
  animation:mpIn .22s ease;z-index:50}
.music-panel.open{display:flex}
@keyframes mpIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.mp-title{font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:#7fe3ff;text-align:center}
.mp-now{font-size:.75rem;color:var(--muted);text-align:center;
  background:rgba(0,217,255,.06);border:1px dashed rgba(0,217,255,.25);
  border-radius:10px;padding:8px 9px;line-height:1.45}
.mp-now b{color:#c9f6ff;font-weight:600}
.mp-now small{opacity:.7}
.mp-btns{display:flex;flex-direction:column;gap:8px}
.mp-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;cursor:pointer;
  font-family:inherit;font-size:.85rem;font-weight:600;text-align:left;
  background:rgba(255,255,255,.04);border:1.5px solid rgba(168,85,247,.45);color:#d8c9ff;transition:.2s}
.mp-btn:hover:not(:disabled){background:rgba(168,85,247,.22);box-shadow:0 0 16px rgba(168,85,247,.35)}
.mp-btn:disabled{opacity:.3;cursor:not-allowed}
.mp-btn.hindi{border-color:rgba(255,200,61,.5);color:#ffe9a8}
.mp-btn.hindi:hover:not(:disabled){background:rgba(255,200,61,.16);box-shadow:0 0 16px rgba(255,200,61,.35)}
.mp-btn.english{border-color:rgba(0,217,255,.5);color:#aef0ff}
.mp-btn.english:hover:not(:disabled){background:rgba(0,217,255,.14);box-shadow:0 0 16px rgba(0,217,255,.35)}
.mp-btn.next{border-color:rgba(34,229,139,.5);color:#b8ffd9}
.mp-btn.next:hover:not(:disabled){background:rgba(34,229,139,.14);box-shadow:0 0 16px rgba(34,229,139,.35)}
.mp-btn.active{outline:2px solid rgba(255,255,255,.25);outline-offset:1px}
.mp-btn .micn{width:18px;text-align:center;flex-shrink:0}
.mp-row{display:flex;gap:8px}
.mp-row .mp-btn{flex:1;justify-content:center;font-size:.8rem}
.mp-vol{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.mp-vol input{flex:1;accent-color:#00d9ff;cursor:pointer}
.mp-count{font-size:.68rem;color:var(--muted);text-align:center}

/* ════ HERO ════ */
.hero{text-align:center;padding:clamp(30px,5vw,52px) 16px 24px}
.hero h1{font-size:clamp(2.1rem,5vw,3.4rem);font-weight:800;
  filter:drop-shadow(0 0 22px rgba(0,217,255,.35))}
.hero .script{font-size:clamp(1.7rem,3.4vw,2.4rem);margin-top:-4px;font-weight:400;
  filter:drop-shadow(0 0 16px rgba(255,47,210,.4))}
.hero-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
.hero-row .ln{width:clamp(40px,8vw,90px);height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,#00d9ff)}
.hero-row .ln.r{background:linear-gradient(90deg,#00d9ff,transparent)}
.hero-row .dot{width:6px;height:6px;border-radius:50%;background:#00d9ff;box-shadow:0 0 8px #00d9ff}
.hero-row h2{font-size:clamp(1.25rem,2.6vw,1.7rem);font-weight:700;letter-spacing:.02em}
.hero .sub{margin-top:10px;font-size:1.08rem;color:#b9c2e8}
.hero .micro{margin-top:2px;font-size:1.05rem;color:#8f9cd0}

/* ════ CARDS — image poori card me, properly aligned ════ */
.grid{width:min(1280px,100%);margin:0 auto;
  padding:10px clamp(14px,3vw,40px) 40px;
  display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(245px,1fr))}
.card{--accent:0 217 255;position:relative;overflow:hidden;
  background:rgba(9,5,32,.62);backdrop-filter:blur(12px);
  border:1px solid rgb(var(--accent)/.35);border-radius:18px;
  padding:24px 18px 18px;display:flex;flex-direction:column;gap:14px;
  transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-5px);border-color:rgb(var(--accent)/.8);
  box-shadow:0 14px 44px rgb(var(--accent)/.22)}

/* ✅ FIX: image poori card ko fill karegi — full visible, kata nahi */
.card-bg{position:absolute;inset:0;z-index:0;pointer-events:none}
.card-bg img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  object-position:center center;   /* image center me align */
  opacity:.55;
  filter:saturate(1.2) drop-shadow(0 0 18px rgb(var(--accent)/.3));
}
/* readability overlay — neeche dark, buttons readable */
.card-bg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,
    rgba(7,3,26,.55) 0%,
    rgba(7,3,26,.25) 35%,
    rgba(7,3,26,.30) 55%,
    rgba(7,3,26,.88) 100%);
}
.card-head,.roles{position:relative;z-index:1}
.card-head{text-align:center}
.site-badge{width:72px;height:72px;margin:0 auto 10px;display:grid;place-items:center;
  border-radius:50%;border:2.5px solid rgb(var(--accent)/.75);
  background:rgba(6,3,24,.75);overflow:hidden;font-size:1.9rem;font-weight:800;
  box-shadow:0 0 20px rgb(var(--accent)/.3),inset 0 0 14px rgb(var(--accent)/.12)}
.site-badge img{width:100%;height:100%;object-fit:cover}
.site-badge svg{width:34px;height:34px}
.h-arr{font-size:1rem;vertical-align:super;margin-left:-6px}
.card-head h2{font-size:1.28rem;font-weight:700;
  text-shadow:0 2px 10px rgba(0,0,0,.8)}
.tagline{font-size:1rem;color:#cfd6f5;text-shadow:0 1px 8px rgba(0,0,0,.8)}

.roles{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.role-btn{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:12px;
  text-decoration:none;border:1.5px solid rgb(var(--role)/.55);color:rgb(var(--role));
  background:rgba(6,3,24,.6);transition:.2s}
.role-btn:hover{background:rgb(var(--role));color:#0b0518;box-shadow:0 0 22px rgb(var(--role)/.5)}
.role-btn .ric{width:20px;height:20px;flex-shrink:0}
.role-text{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.role-text strong{font-size:.9rem;font-weight:600}
.role-text small{font-size:.62rem;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role-arrow{margin-left:auto;opacity:.85;width:15px;height:15px;flex-shrink:0}
.role-btn.owner{--role:255 200 61}
.role-btn.admin{--role:255 47 210}
.role-btn.moderator{--role:0 217 255}

/* ════ FOOTER ════ */
footer{margin-top:auto;text-align:center;padding:20px 16px 26px;border-top:1px solid var(--border);
  background:rgba(4,2,18,.45);backdrop-filter:blur(8px)}
.f-brand{display:flex;align-items:center;justify-content:center;gap:16px;font-weight:800;font-size:1.15rem}
.f-brand .ln{width:clamp(40px,7vw,110px);height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#00d9ff)}
.f-brand .ln.r{background:linear-gradient(90deg,#00d9ff,transparent)}
.f-sub{margin-top:6px;font-size:.85rem;letter-spacing:.35em;color:var(--cyan);text-transform:uppercase}

@media (max-width:980px){.searchbox{min-width:150px}}
@media (max-width:860px){.nav{display:none}}
@media (max-width:640px){.searchbox{display:none}
  .bg-mountains{height:24vh;min-height:130px}
  .music-panel{width:236px;right:-30px}}
</style>
</head>
<body>

<!-- global gradients -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="lgTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d9ff"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="lgBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="lgPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2fd2"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
</svg>

<!-- ════ LOADING SCREEN ════ -->
<div id="loader">
  <div class="loader-logo" id="loadLogo">
    <svg viewBox="0 0 32 32"><path d="M16 2 30 29H2Z" fill="url(#lgTop)"/><path d="M16 12l6.5 13h-13Z" fill="#04010f"/></svg>
  </div>
  <div class="loader-title agrad">AnimeTubePro</div>
  <div class="loader-sub f-vibes agrad">Web Studio</div>
  <div class="loader-bar"><span id="loadBar"></span></div>
  <div class="loader-pct" id="loadPct">0%</div>
</div>

<!-- ════ BACKGROUND ════ -->
<div class="bg" id="bg">
  <div class="bg-glow glow-left"></div>
  <div class="bg-glow glow-right"></div>
  <div class="bg-glow glow-horizon"></div>
  <svg class="bg-mountains" viewBox="0 0 1440 320" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="mBack" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3b2a86"/><stop offset="1" stop-color="#1a0f4d"/>
      </linearGradient>
      <linearGradient id="mFront" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#140a3a"/><stop offset="1" stop-color="#07031f"/>
      </linearGradient>
      <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="35"/>
      </filter>
    </defs>
    <ellipse cx="720" cy="315" rx="720" ry="55" fill="#00d9ff" opacity=".28" filter="url(#softBlur)"/>
    <ellipse cx="1000" cy="320" rx="300" ry="35" fill="#ec4899" opacity=".22" filter="url(#softBlur)"/>
    <path fill="url(#mBack)" opacity=".75"
      d="M0 320 L0 200 L120 135 L260 210 L380 115 L520 200 L640 145 L760 210 L900 125 L1040 200 L1160 145 L1300 210 L1440 155 L1440 320 Z"/>
    <path fill="url(#mFront)"
      d="M0 320 L0 255 L160 190 L300 255 L460 170 L620 255 L780 200 L940 262 L1100 180 L1260 255 L1440 200 L1440 320 Z"/>
  </svg>
  <div class="bg-img" id="bgImg"></div>
</div>

<div class="fx-layer" id="fx"></div>

<!-- ════ TOPBAR ════ -->
<header class="topbar">
  <div class="brand">
    <div class="brand-logo" id="brandLogo">
      <svg viewBox="0 0 32 32"><path d="M16 2 30 29H2Z" fill="url(#lgTop)"/><path d="M16 12l6.5 13h-13Z" fill="#04010f"/></svg>
    </div>
    <div>
      <div class="brand-name agrad">AnimeTubePro</div>
      <div class="brand-sub">Web Studio</div>
    </div>
  </div>

  <nav class="nav">
    <a href="#" class="active">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5L12 3Z"/></svg>
      Home
    </a>
    <a href="#dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6-6 6 6 6M16 6l6 6-6 6"/></svg>
      Web Studio
    </a>
  </nav>

  <div class="searchbox">
    <input type="text" id="search" placeholder="Search anime, movies, series...">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </div>

  <button class="icon-btn" id="moonBtn" title="Calm mode (particles on/off)">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
  </button>

        <button class="mp-btn hindi" id="mpHindi">

        </button>
        <button class="mp-btn english" id="mpEnglish">
          <span class="micn">🌍</span><span id="mpEnglishLbl">English Songs</span>
        </button>
        <button class="mp-btn next" id="mpNext">
          <span class="micn">⏭</span><span>Next Hindi Song</span>
        </button>
      </div>
      <div class="mp-row">
        <button class="mp-btn" id="mpPause">⏸ Pause</button>
        <button class="mp-btn" id="mpStop">⏹ Stop</button>
      </div>
      <div class="mp-vol">🔊 <input type="range" id="mpVol" min="0" max="100" value="80"></div>

  <button class="icon-btn" title="Profile">

<!-- ════ HERO ════ -->
<main id="dashboard">
  <section class="hero">
    <h1 class="agrad">AnimeTubePro</h1>

<!-- ════ FOOTER ════ -->
<footer>
  <div class="f-brand">
    <span class="ln"></span>
    <span>AnimeTubePro <span class="f-pacifico agrad" style="font-weight:400">Web Studio</span></span>
    <span class="ln r"></span>
  </div>
  <div class="f-sub f-cedarville">Build • Create • Grow</div>

<script>
/* ══════════ CONFIG ══════════ */
const CONFIG = {
  loadingSeconds : 3.5,
  cardImages     : true,   /* cards me image */
  particles: { stars:80, fire:16, bubbles:12, petals:12 },
  sfxVolume: .5,

  /* khud songs dena ho to: hindi: ["a.mp3"] — khali [] = auto-detect */
  music: {
    autoplay: true,
    hindi:   [],
    english: []
  }
};

/* SITES */
const SITES = [
  { name:"VEXA",           tagline:"Vexa Platform",  path:"sites/vexa",         accent:"0 217 255",
    icon:'<span class="grad-cyan">V</span>' },
  { name:"AnimeTubePro",   tagline:"Watch • Stream", path:"sites/animetubepro", accent:"90 140 255",
    icon:'<svg viewBox="0 0 32 32"><path d="M16 2 30 29H2Z" fill="url(#lgBlue)"/><path d="M16 12l6.5 13h-13Z" fill="#04010f"/></svg>' },
  { name:"HunterGrowth",   tagline:"Growth Tools",   path:"sites/huntergrowth", accent:"34 229 139",
    icon:'<span class="grad-green">H</span><span class="h-arr grad-green">↗</span>' },
  { name:"Tournament App", tagline:"Events Arena",   path:"sites/tournament",   accent:"255 47 210",
    icon:'<svg viewBox="0 0 24 24" fill="url(#lgPink)"><path d="M6 3h12v2h3v3a5 5 0 0 1-4.6 5A6 6 0 0 1 13 16.9V19h3v2H8v-2h3v-2.1A6 6 0 0 1 7.6 13 5 5 0 0 1 3 8V5h3V3Zm-1 4v1a3 3 0 0 0 2 2.8V7H5Zm14 0h-2v3.8A3 3 0 0 0 19 8V7Z"/></svg>' }
];

const ROLES = [
  { label:"Owner",     file:"owner.html",     cssClass:"owner",     icon:"crown"  },
  { label:"Admin",     file:"admin.html",     cssClass:"admin",     icon:"shield" },
  { label:"Moderator", file:"moderator.html", cssClass:"moderator", icon:"user"   }
];

const ICONS = {
  crown:'<svg class="ric" viewBox="0 0 24 24" fill="currentColor"><path d="M5 16 3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5Zm14 2c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1Z"/></svg>',
  shield:'<svg class="ric" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4 5v6c0 5.2 3.4 10.2 8 11.2 4.6-1 8-6 8-11.2V5l-8-3Zm0 5 1.2 2.6 2.8.3-2.1 1.9.6 2.8L12 13.2 9.5 14.6l.6-2.8L8 9.9l2.8-.3L12 7Z"/></svg>',
  user:'<svg class="ric" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5Z"/></svg>',
  arrow:'<svg class="role-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>'
};

/* ══════════ HELPERS ══════════ */
const EXTS=["png","jpg","jpeg","webp"];
function loadFirst(urls){
  return new Promise(res=>{
    let i=0;
    (function next(){
      if(i>=urls.length) return res(null);
      const im=new Image();
      im.onload=()=>res(urls[i]); im.onerror=()=>{i++;next()};
      im.src=urls[i];
    })();
  });
}

/* ══════════ LOADING SCREEN ══════════ */
const loader=document.getElementById("loader");
let loaderDone=false;
function finishLoader(){
  if(loaderDone)return; loaderDone=true;
  loader.classList.add("hide");
  setTimeout(()=>loader.remove(),700);
}
if(CONFIG.loadingSeconds>0){
  const bar=document.getElementById("loadBar"),pct=document.getElementById("loadPct");
  const t0=performance.now();
  (function tick(){
    const p=Math.min(1,(performance.now()-t0)/(CONFIG.loadingSeconds*1000));
    bar.style.width=(p*100).toFixed(1)+"%";
    pct.textContent=Math.round(p*100)+"% — Loading...";
    if(p<1)requestAnimationFrame(tick); else finishLoader();
  })();
  loader.addEventListener("click",finishLoader);
}else{loader.remove();loaderDone=true;}

/* ══════════ BACKGROUND — full cover ══════════ */
loadFirst(EXTS.map(e=>"background."+e)).then(url=>{
  if(url){
    const b=document.getElementById("bgImg");
    b.style.backgroundImage=`url("${url}")`;
    b.classList.add("on");
    document.getElementById("bg").classList.add("custom");
  }
});

/* ══════════ MAIN LOGO ══════════ */
loadFirst(EXTS.map(e=>"logo."+e)).then(url=>{
  if(url){
    const imgHtml=`<img src="${url}" alt="logo">`;
    document.getElementById("brandLogo").innerHTML=imgHtml;
    const ll=document.getElementById("loadLogo");
    if(ll)ll.innerHTML=imgHtml;
  }
});

/* ══════════ SITE CARDS — image POORI card me, center aligned
   Priority: sites/<path>/card.png → card1.png → hand1.png (root) ══════════ */
const grid=document.getElementById("grid");
SITES.forEach((site,i)=>{
  const card=document.createElement("article");
  card.className="card";card.style.setProperty("--accent",site.accent);
  card.dataset.name=site.name+" "+site.tagline;
  card.innerHTML=`
    <div class="card-bg"></div>
    <div class="card-head">
      <div class="site-badge">${site.icon||site.name.charAt(0)}</div>
      <h2>${site.name}</h2>
      <p class="tagline f-dancing">${site.tagline}</p>
    </div>
    <div class="roles">
      ${ROLES.map(r=>`
        <a class="role-btn ${r.cssClass}" href="${site.path}/${r.file}" title="Open ${site.name} — ${r.label}">
          ${ICONS[r.icon]}
          <span class="role-text"><strong>${r.label}</strong><small>${site.path}/${r.file}</small></span>
          ${ICONS.arrow}
        </a>`).join("")}
    </div>`;
  grid.appendChild(card);

  /* badge logo */
  const badge=card.querySelector(".site-badge");
  loadFirst(EXTS.map(e=>`${site.path}/logo.${e}`)).then(url=>{
    if(url)badge.innerHTML=`<img src="${url}" alt="${site.name} logo">`;
  });

  /* card background image — FULL, center */
  if(CONFIG.cardImages){
    const n=i+1;
    const cands=[
      ...EXTS.map(e=>`${site.path}/card.${e}`),
      ...EXTS.map(e=>`card${n}.${e}`),
      ...EXTS.map(e=>`hand${n}.${e}`)
    ];
    loadFirst(cands).then(url=>{
      if(url)card.querySelector(".card-bg").innerHTML=`<img src="${url}" alt="">`;
    });
  }
});

/* search */
document.getElementById("search").addEventListener("input",e=>{
  const q=e.target.value.toLowerCase();
  document.querySelectorAll(".card").forEach(c=>
    c.style.display=c.dataset.name.toLowerCase().includes(q)?"":"none");
});

/* moon — calm mode */
document.getElementById("moonBtn").addEventListener("click",()=>
  document.body.classList.toggle("calm"));

/* ══════════ PARTICLES ══════════ */
const fx=document.getElementById("fx");
const P=CONFIG.particles, rnd=(a,b)=>(Math.random()*b+a);
for(let i=0;i<P.stars;i++){const s=document.createElement("span");const r=Math.random();
  s.className="star"+(r>.85?" cyan":r>.7?" purple":"");
  s.style.cssText=`left:${rnd(0,100)}%;top:${rnd(0,75)}%;width:${rnd(1,3)}px;height:${rnd(1,3)}px;
    animation-duration:${rnd(2,5)}s;animation-delay:${rnd(0,4)}s`;fx.appendChild(s)}
for(let i=0;i<P.fire;i++){const f=document.createElement("span");f.className="p-fire";
  const sz=rnd(3,9);f.style.cssText=`left:${rnd(0,100)}%;width:${sz}px;height:${sz*1.4}px;
    --sway:${rnd(-40,40)}px;--dur:${rnd(5,10)}s;--delay:-${rnd(0,10)}s;
    background:radial-gradient(circle at 50% 80%,#fff6c2,#ffb03a 45%,#ff5a1f 75%,transparent);
    box-shadow:0 0 10px 2px rgba(255,120,30,.55)`;fx.appendChild(f)}
for(let i=0;i<P.bubbles;i++){const b=document.createElement("span");b.className="p-bubble";
  const sz=rnd(6,20);b.style.cssText=`left:${rnd(0,100)}%;width:${sz}px;height:${sz}px;
    --sway:${rnd(-30,30)}px;--dur:${rnd(9,17)}s;--delay:-${rnd(0,15)}s`;fx.appendChild(b)}
for(let i=0;i<P.petals;i++){const p=document.createElement("span");p.className="p-petal";
  p.style.cssText=`left:${rnd(0,100)}%;--sway:${rnd(-140,140)}px;
    --dur:${rnd(9,16)}s;--delay:-${rnd(0,14)}s`;fx.appendChild(p)}

/* ══════════════════════════════════════════════════════
   🎵 MUSIC PLAYER
   Folder me daalo: hindi1.mp3 ... english1.mp3 ...
   ══════════════════════════════════════════════════════ */
const AUDIO_EXTS=["mp3","ogg","wav","m4a"];
const musicBtn=document.getElementById("musicBtn");
const musicPanel=document.getElementById("musicPanel");
const mpNow=document.getElementById("mpNow");
const mpCount=document.getElementById("mpCount");
const mpPause=document.getElementById("mpPause");
const mpHindi=document.getElementById("mpHindi");
const mpEnglish=document.getElementById("mpEnglish");
const mpNext=document.getElementById("mpNext");
const mpVol=document.getElementById("mpVol");

const MUSIC={
  lists:{hindi:[],english:[]},
  cur:null,
  idx:{hindi:0,english:0},
  audio:new Audio(),
  playing:false
};
MUSIC.audio.volume=.8;

function audioExists(url){
  return new Promise(res=>{
    const a=new Audio();
    a.preload="metadata";
    const ok=setTimeout(()=>res(false),4000);
    a.addEventListener("loadedmetadata",()=>{clearTimeout(ok);res(true)},{once:true});
    a.addEventListener("error",()=>{clearTimeout(ok);res(false)},{once:true});
    a.src=url;
  });
}
async function firstAudio(base){
  for(const e of AUDIO_EXTS){
    const u=`${base}.${e}`;
    if(await audioExists(u))return u;
  }
  return null;
}
async function detectList(base){
  if(CONFIG.music[base] && CONFIG.music[base].length)
    return CONFIG.music[base].slice();
  const names=[base,...Array.from({length:8},(_,i)=>base+(i+1))];
  const found=await Promise.all(names.map(n=>firstAudio(n)));
  return found.filter(Boolean);
}
function songName(url){
  const f=url.split("/").pop().replace(/\.[^.]+$/,"");
  return f.charAt(0).toUpperCase()+f.slice(1);
}

function refreshUI(){
  const hi=MUSIC.lists.hindi.length, en=MUSIC.lists.english.length;
  mpCount.textContent=`Hindi: ${hi} songs • English: ${en} songs`;
  if(!hi && !en){
    mpNow.innerHTML=`❌ Songs nahi mile<br><small>Root folder me daalo: hindi1.mp3 / english1.mp3</small>`;
  }else if(MUSIC.cur){
    const list=MUSIC.lists[MUSIC.cur];
    const name=songName(list[MUSIC.idx[MUSIC.cur]%list.length]);
    const emoji=MUSIC.cur==="hindi"?"🎬":"🌍";
    mpNow.innerHTML=`${emoji} <b>${name}</b><br><small>${MUSIC.playing?"▶ Playing":"⏸ Paused"}</small>`;
  }else{
    mpNow.textContent="Koi song select nahi — button dabao";
  }
  document.getElementById("mpHindiLbl").textContent=
    (MUSIC.cur==="hindi"&&MUSIC.playing)?"Pause Hindi ⏸":"Hindi Songs";
  document.getElementById("mpEnglishLbl").textContent=
    (MUSIC.cur==="english"&&MUSIC.playing)?"Pause English ⏸":"English Songs";
  mpHindi.classList.toggle("active",MUSIC.cur==="hindi");
  mpEnglish.classList.toggle("active",MUSIC.cur==="english");
  mpHindi.disabled=!hi; mpEnglish.disabled=!en; mpNext.disabled=!hi;
  mpPause.textContent=MUSIC.playing?"▶ Play":"⏸ Pause";
  musicBtn.classList.toggle("playing",MUSIC.playing);
}

function play(name){
  const list=MUSIC.lists[name];
  if(!list.length)return;
  MUSIC.cur=name;
  const i=((MUSIC.idx[name]%list.length)+list.length)%list.length;
  MUSIC.audio.src=list[i];
  MUSIC.audio.play().then(()=>{MUSIC.playing=true;refreshUI();})
    .catch(()=>{MUSIC.playing=false;refreshUI();});
  refreshUI();
}

mpHindi.addEventListener("click",()=>{
  if(MUSIC.cur==="hindi"){
    if(MUSIC.playing){MUSIC.audio.pause();MUSIC.playing=false;}
    else{MUSIC.audio.play().catch(()=>{});MUSIC.playing=true;}
    refreshUI();
  }else play("hindi");
});
mpEnglish.addEventListener("click",()=>{
  if(MUSIC.cur==="english"){
    if(MUSIC.playing){MUSIC.audio.pause();MUSIC.playing=false;}
    else{MUSIC.audio.play().catch(()=>{});MUSIC.playing=true;}
    refreshUI();
  }else play("english");
});
mpNext.addEventListener("click",()=>{
  if(!MUSIC.lists.hindi.length)return;
  MUSIC.idx.hindi++;
  play("hindi");
});
mpPause.addEventListener("click",()=>{
  if(!MUSIC.cur)return;
  if(MUSIC.playing){MUSIC.audio.pause();MUSIC.playing=false;}
  else{MUSIC.audio.play().catch(()=>{});MUSIC.playing=true;}
  refreshUI();
});
document.getElementById("mpStop").addEventListener("click",()=>{
  MUSIC.audio.pause();MUSIC.audio.currentTime=0;
  MUSIC.playing=false;MUSIC.cur=null;refreshUI();
});
mpVol.addEventListener("input",()=>MUSIC.audio.volume=mpVol.value/100);

MUSIC.audio.addEventListener("ended",()=>{
  if(MUSIC.cur){MUSIC.idx[MUSIC.cur]++;play(MUSIC.cur);}
});
MUSIC.audio.addEventListener("error",()=>{
  if(MUSIC.cur && MUSIC.lists[MUSIC.cur].length>1){
    MUSIC.idx[MUSIC.cur]++;play(MUSIC.cur);
  }else{MUSIC.playing=false;refreshUI();}
});

musicBtn.addEventListener("click",e=>{
  e.stopPropagation();
  musicPanel.classList.toggle("open");
});
document.addEventListener("click",e=>{
  if(!e.target.closest(".music-wrap"))musicPanel.classList.remove("open");
});

(async()=>{
  const [hi,en]=await Promise.all([detectList("hindi"),detectList("english")]);
  MUSIC.lists.hindi=hi;MUSIC.lists.english=en;
  refreshUI();
  if(CONFIG.music.autoplay && hi.length){
    document.addEventListener("pointerdown",()=>{
      if(!MUSIC.cur)play("hindi");
    },{once:true});
  }
})();

/* ══════════ CLICK + HOVER SFX ══════════ */
let sfxCtx=null;
function sfx(f1,f2,dur,vol,type){
  if(!sfxCtx){
    try{sfxCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  }
  if(sfxCtx.state==="suspended")sfxCtx.resume();
  const t=sfxCtx.currentTime,o=sfxCtx.createOscillator(),g=sfxCtx.createGain();
  o.type=type||"triangle";
  o.frequency.setValueAtTime(f1,t);
  o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol*CONFIG.sfxVolume,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(sfxCtx.destination);o.start(t);o.stop(t+dur);
}
document.addEventListener("click",e=>{
  if(e.target.closest("a,button"))sfx(520,180,.12,.1);
});
document.addEventListener("mouseover",e=>{
  const b=e.target.closest(".role-btn");
  if(b&&!b.dataset.h){b.dataset.h=1;sfx(900,1200,.05,.03,"sine");}
});
</script>
